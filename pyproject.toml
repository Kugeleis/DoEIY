[project]
name = "doeiy"
version = "1.0.2"
description = "Add your description here"
authors = [
    { name = "Kugeleis", email = "9948777+Kugeleis@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "patsy>=1.0.2",
    "pydantic>=2.13.4",
    "pydoe2>=1.3.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.bumpversion]
current_version = "1.0.2"
commit = true
tag = true
tag_name = "v{new_version}"
commit_args = "--no-verify"
allow_shell_hooks = true
pre_commit_hooks = [
    "git add uv.toml"
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "version.txt"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "uv.toml"
search = '# version = "{current_version}"'
replace = '# version = "{new_version}"'
