# Configuration for prek Git hooks

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff Linter"
entry = ".venv/bin/ruff check app/ tests/"
language = "system"
types = ["python"]
always_run = false
pass_filenames = false

[[repos.hooks]]
id = "ruff-format"
name = "Ruff Formatter"
entry = ".venv/bin/ruff format --check app/ tests/"
language = "system"
types = ["python"]
always_run = false
pass_filenames = false

[[repos.hooks]]
id = "mypy"
name = "MyPy Type Checker"
entry = ".venv/bin/mypy app/ tests/"
language = "system"
types = ["python"]
always_run = false
pass_filenames = false

[[repos.hooks]]
id = "r-unit-tests"
name = "Run R Unit Tests (Docker)"
entry = "docker compose exec -T doeiy Rscript tests/run_tests.R"
language = "system"
always_run = true
pass_filenames = false
