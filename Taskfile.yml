version: '3'

tasks:
  setup:
    desc: Set up Python virtual environment and dependencies using uv
    cmds:
    - uv sync

  dev:
    desc: Start the FastAPI dev server locally with auto-reload
    cmds:
    - uv run uvicorn app.main:app --reload --host 127.0.0.1 --port 3839

  lint:
    desc: Run ruff linter check with autofix
    cmds:
    - uv run ruff check --fix app/ tests/

  format:
    desc: Run ruff formatter check
    cmds:
    - uv run ruff format {{.CLI_ARGS}} app/ tests/

  type-check:
    desc: Run mypy type checker
    cmds:
    - uv run mypy app/ tests/

  test:
    desc: Run Python unit and integration tests locally with pytest
    cmds:
    - uv run pytest tests/

  install-hooks:
    desc: Install prek git hooks
    cmds:
    - prek install

  build:
    desc: Build the Docker image
    cmds:
    - docker compose build

  build-clean:
    desc: Build the Docker image from scratch without using cache
    cmds:
    - docker compose build --no-cache

  up:
    desc: Start the Docker container in the background
    cmds:
    - docker compose up -d

  down:
    desc: Stop and remove the Docker container
    cmds:
    - docker compose down

  logs:
    desc: View the Docker container logs in real-time
    cmds:
    - docker compose logs -f

  restart:
    desc: Restart the Docker container
    cmds:
    - docker compose restart

  test-container:
    desc: Run Python unit tests inside the Docker container
    cmds:
    - docker compose exec -T doeiy .venv/bin/pytest tests/

  test-clean:
    desc: Rebuild the Docker image without cache and run tests in container
    cmds:
    - task: build-clean
    - task: up
    - task: test-container

  check:
    desc: Run all code quality checks (lint, format, type-check, and tests)
    cmds:
    - task: lint
    - task: format
    - task: type-check
    - task: test

  b-M:
    desc: Start next Major development cycle (e.g., 1.0.2 -> 2.0.0.dev0)
    cmds:
      - uv run bump-my-version bump major

  b-m:
    desc: Start next minor development cycle (e.g., 1.0.2 -> 1.1.0.dev0)
    cmds:
      - uv run bump-my-version bump minor

  b-p:
    desc: Start next patch development cycle (e.g., 1.0.2 -> 1.0.3.dev0)
    cmds:
      - uv run bump-my-version bump patch

  b-dev:
    desc: Bump pre-release development number (e.g., 1.0.3.dev0 -> 1.0.3.dev1)
    cmds:
      - uv run bump-my-version bump pre_n

  b-rc:
    desc: Transition to release candidate phase (e.g., 1.0.3.dev1 -> 1.0.3.rc0)
    cmds:
      - uv run bump-my-version bump pre_l --value rc

  b-release:
    desc: Release stable version (e.g., 1.0.3.rc0 -> 1.0.3)
    cmds:
      - uv run bump-my-version bump pre_l --value final
